<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collection — Alex Teih</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&family=Rock+Salt&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="header" id="header">
    <div class="header__left mono">
      <a href="index.html" class="u-link">← BACK</a>
      <a href="index.html#collections" class="u-link">COLLECTIONS</a>
      <span class="header__time" id="nyTime">NY 00:00</span>
    </div>
    <a href="index.html" class="header__logo" aria-label="Alex Teih — home">ALEX TEIH</a>
    <div class="header__right mono">
      <a href="index.html#contact" class="u-link">APPOINTMENT</a>
      <a href="index.html#contact" class="u-link">CONTACT</a>
    </div>
  </header>

  <main>
    <section class="coll-hero">
      <div>
        <span class="mono accent" id="collIdx">COLLECTION</span>
        <h1 class="display" id="collName" data-split>COLLECTION</h1>
      </div>
      <p class="mono" id="collLine"></p>
    </section>
    <nav class="coll-tabs mono" id="collTabs" aria-label="Collections"></nav>
    <section class="coll-grid" id="collGrid"></section>
    <a class="coll-next" id="collNext" href="#">
      <span class="mono accent">NEXT COLLECTION →</span>
      <span class="display" id="collNextName"></span>
    </a>
  </main>

  <footer class="footer" id="contact" style="margin-top:0">
    <div class="footer__inner">
      <div class="footer__bottom mono">
        <span>© <span id="year"></span> ALEX TEIH · NEW YORK</span>
        <a href="mailto:darrell@alexteih.com" class="u-link">DARRELL@ALEXTEIH.COM</a>
        <a href="tel:+16466234643" class="u-link">646.623.4643</a>
        <a href="https://www.instagram.com/alexteih_studio/" target="_blank" rel="noopener" class="u-link">INSTAGRAM</a>
      </div>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Look viewer">
    <button class="lightbox__close mono" id="lbClose">[ CLOSE ]</button>
    <button class="lightbox__nav lightbox__nav--prev mono" id="lbPrev" aria-label="Previous">←</button>
    <figure class="lightbox__fig"><img id="lbImg" src="" alt="" /><figcaption class="mono" id="lbCap"></figcaption></figure>
    <button class="lightbox__nav lightbox__nav--next mono" id="lbNext" aria-label="Next">→</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script>
    // fill page content before main.js splits the title
    (() => {
      const C = window.AT_COLLECTIONS;
      const slug = new URLSearchParams(location.search).get('c');
      let i = Math.max(0, C.findIndex(c => c.slug === slug));
      const c = C[i], next = C[(i + 1) % C.length];
      document.title = `${c.name} — Alex Teih`;
      document.getElementById('collIdx').textContent = `0${i + 1} / 0${C.length} — (${c.tag}) — [ ${String(c.looks.length).padStart(2, '0')} LOOKS ]`;
      document.getElementById('collName').textContent = c.name;
      document.getElementById('collLine').textContent = c.line;
      document.getElementById('collTabs').innerHTML = C.map(x =>
        `<a href="collection.html?c=${x.slug}" class="u-link ${x.slug === c.slug ? 'is-on' : ''}">${x.name} [${x.looks.length}]</a>`).join('');
      document.getElementById('collNext').href = `collection.html?c=${next.slug}`;
      document.getElementById('collNextName').textContent = next.name;
      window.__coll = c;
    })();
  </script>
  <script src="assets/js/main.js"></script>
  <script>
    (() => {
      const c = window.__coll, pad = n => String(n).padStart(2, '0');
      const num = s => +s.match(/-(\d+)\.jpg$/)[1];
      const grid = document.getElementById('collGrid');
      grid.innerHTML = c.looks.map((src, i) => window.AT_lookCard({ src, n: i + 1, collection: c.name, tag: c.tag, badge: i === 0 ? 'NEW' : '' }, i)).join('');
      const list = c.looks.map((src, i) => ({ src, cap: `${c.name} — Look ${pad(i + 1)}` }));
      grid.addEventListener('click', e => { const card = e.target.closest('[data-i]'); if (card) window.AT_openLightbox(list, +card.dataset.i); });
      if (window.gsap && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        gsap.from('.coll-hero .line > span', { yPercent: 110, duration: 1.2, ease: 'expo.out', delay: .1 });
        gsap.from(['#collIdx', '#collLine', '.coll-tabs'], { opacity: 0, y: 16, duration: .9, stagger: .08, delay: .3 });
        gsap.set('.coll-grid .card', { opacity: 0 });
        ScrollTrigger.batch('.coll-grid .card', {
          start: 'top 92%',
          onEnter: els => gsap.fromTo(els, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, stagger: .07, ease: 'expo.out' }),
        });
      }
    })();
  </script>
</body>
</html>
